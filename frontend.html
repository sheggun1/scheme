<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple welcome page for the Veehicee project.">
  <title>Hello World | Veehicee</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #14233a;
      background: linear-gradient(135deg, #eef1f6, #dce9e4);
    }
    main {
      width: min(100%, 620px);
      padding: 48px 32px;
      text-align: center;
      background: #fff;
      border: 1px solid #dbe2ec;
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(16, 41, 74, .10);
    }
    .brand { color: #0b6e4f; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 18px 0 12px; color: #10294a; font-size: clamp(2.2rem, 8vw, 3.6rem); }
    p { margin: 0 auto 28px; max-width: 42ch; color: #4a5b73; line-height: 1.7; }
    a {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 8px;
      background: #0b6e4f;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
    a:hover { background: #095a41; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Veehicee</div>
    <h1>Hello, World!</h1>
    <p>Welcome to the frontend page. This is a simple, responsive HTML starting point for the project.</p>
    <a href="index.html">Open Curriculum Library</a>
  </main>
</body>
</html>
